<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Inventory PoC</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* Embedding the dashboard style directly to ensure it matches your PPT design */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 300px; background: #1a237e; color: white; padding: 25px; display: flex; flex-direction: column; }
        #main { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; }
        #chat-box { background: white; flex-grow: 1; border-radius: 15px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 25px; border-bottom: 1px solid #eee; }
        .input-area { padding: 20px; display: flex; background: #fff; }
        input { flex-grow: 1; padding: 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 16px; }
        button { background: #1a237e; color: white; border: none; padding: 10px 25px; margin-left: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #283593; transform: scale(1.05); }
        .kpi-card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 0.9em; line-height: 1.6; border: 1px solid rgba(255,255,255,0.2); }
        .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 10px; max-width: 85%; }
        .user-msg { background: #e3f2fd; align-self: flex-end; margin-left: auto; color: #1565c0; }
        .bot-msg { background: #f5f5f5; align-self: flex-start; color: #333; border: 1px solid #eee; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2 style="margin-bottom: 5px;">📦 Inventory PoC</h2>
        <p style="opacity: 0.8; font-size: 0.9em;">Developer: Manasa Mukka</p>
        <hr style="width: 100%; border: 0.5px solid rgba(255,255,255,0.2); margin: 20px 0;">
        
        <div class="kpi-card">
            <strong>🚀 Project KPIs:</strong><br>
            ⏱️ Reporting: 30m → 3m<br>
            📉 Stockouts: -40%<br>
            🌱 CO2: Smarter Resource Mgmt
        </div>
        
        <div style="margin-top: auto; font-size: 0.8em; opacity: 0.6;">
            Model: Llama 3 8B (Groq)<br>
            Logic: RAG + Foundation Layer
        </div>
    </div>

    <div id="main">
        <h1 style="color: #1a237e; margin-top: 0;">GenAI Assistant</h1>
        <div id="chat-box">
            <div id="messages" style="display: flex; flex-direction: column;">
                <div class="msg bot-msg">Hello! I am your AI Inventory Assistant. Ask me about stock levels or shipping policies.</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Ask about stock or reorder policies..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Ask AI</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('messages');
            const userText = input.value.trim();
            if(!userText) return;

            // Display User Message
            messages.innerHTML += `<div class="msg user-msg"><strong>You:</strong> ${userText}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: userText})
                });
                const data = await res.json();
                
                // Display AI Message
                messages.innerHTML += `<div class="msg bot-msg"><strong>AI Assistant:</strong> ${data.response}</div>`;
                messages.scrollTop = messages.scrollHeight;
            } catch (err) {
                messages.innerHTML += `<div class="msg bot-msg" style="color: red;">Error: Could not connect to the server. Check your terminal.</div>`;
            }
        }
    </script>
</body>
</html>
